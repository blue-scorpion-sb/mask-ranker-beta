<body><header><div><h1>面膜分析大師 <span class="badge">V2</span></h1><div class="subtitle">YOUR PERSONAL MASK JOURNAL</div></div><div class="headeractions"><button id="userButton" type="button">👤 設定人名</button><button class="primary" id="addButton" type="button">＋ 新增記錄</button></div></header>

let db=null,records=[],loaded=false,loading=false,view='list',selected=null,dirty=false,busy=false,editing=null,uploadFile=null,previewURL=null,currentPanel='',previousFocus=null,toastTimer;
function storedName(){try{return (localStorage.getItem('mask_username')||'').trim()}catch(e){return ''}}

function safeUrl(v){try{let u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:placeholder}catch(e){return placeholder}}

function attachImageFallback(root){root.querySelectorAll('[data-fallback]').forEach(im=>im.addEventListener('error',()=>{im.src=placeholder},{once:true}))}
function validNum(v){return v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))}
function num(v){return validNum(v)?Number(v):null}
function fmt(v){let n=num(v);return n===null?'—':n.toLocaleString('en-US',{maximumFractionDigits:4})}
function ratingText(r){return validNum(r.rating)?fmt(r.rating)+'/10':'未評分'}
function stamp(v){let n=Date.parse(v);return Number.isFinite(n)?n:0}
function getResults(){const q=$('search').value.trim().toLowerCase();let a=records.filter(r=>[r.name,r.source,r.comment].some(v=>String(v??'').toLowerCase().includes(q)));const t=$('sort').value;a.sort((a,b)=>{let v=0;if(t==='new'||t==='old')v=(stamp(a.created_at)-stamp(b.created_at))*(t==='new'?-1:1);else if(t.startsWith('name'))v=String(a.name??'').localeCompare(String(b.name??''),'zh-Hant',{numeric:true})*(t.endsWith('Down')?-1:1);else {let f=t.startsWith('rating')?'rating':'price',x=num(a[f]),y=num(b[f]);if(x===null&&y!==null)return 1;if(y===null&&x!==null)return -1;v=x===null?0:(x-y)*(t.endsWith('Down')?-1:1)}return v||stamp(b.created_at)-stamp(a.created_at)||String(a.id).localeCompare(String(b.id))});return a}
function findRecord(id){return records.find(r=>String(r.id)===String(id))}
function setView(v){view=v;render()}
function clearSearch(){$('search').value='';render()}
function sortColumn(f){$('sort').value=$('sort').value===f+'Down'?f+'Up':f+'Down';render()}
function render(){let a=getResults();$('listTab').classList.toggle('active',view==='list');$('chartTab').classList.toggle('active',view==='chart');$('listTab').setAttribute('aria-pressed',view==='list');$('chartTab').setAttribute('aria-pressed',view==='chart');$('chartSettings').hidden=view!=='chart';$('count').textContent=loaded?`顯示 ${a.length} / ${records.length} 筆`:'';if(!loaded){$('content').innerHTML='<div class="statusbox">'+(loading?'載入記錄中…':'未能讀取資料，請按「更新」重試。')+'</div>';return}if(!a.length){$('content').innerHTML=`<div class="statusbox">${records.length?'搵唔到符合條件嘅面膜':'暫時未有記錄'}<br><br><button data-action="${records.length?'clear':'add'}">${records.length?'清除搜尋':'新增第一筆記錄'}</button></div>`;return}if(view==='list'){let sort=$('sort').value;function th(f,label){let arrow=sort.startsWith(f)?(sort.endsWith('Down')?' ↓':' ↑'):' ↕';return `<th><button data-action="sort" data-field="${f}">${label}${arrow}</button></th>`}$('content').innerHTML=`<table><thead><tr>${th('name','面膜名稱')}${th('price','價錢')}${th('rating','評分')}<th>購入地點</th><th>操作</th></tr></thead><tbody>${a.map(r=>`<tr><td><button class="product" data-action="detail" data-id="${esc(r.id)}">${image(r)}<span><span class="name">${esc(r.name||'未命名面膜')}</span><span class="mobilemeta">${num(r.price)===null?'—':'$'+fmt(r.price)}　<span class="rating">${ratingText(r)}</span></span><span class="comment" style="display:block">${esc(r.comment||'未有短評')}</span><span class="mobilemeta muted">${esc(r.source||'—')}</span><span class="notename" style="display:block">By ${esc(r.user_name||'未填人名')}</span></span></button></td><td class="price">${num(r.price)===null?'—':'$'+fmt(r.price)}</td><td><span class="rating">${ratingText(r)}</span></td><td>${esc(r.source||'—')}</td><td><button class="edit" data-action="edit" data-id="${esc(r.id)}">編輯</button></td></tr>`).join('')}</tbody></table>`}else renderChart(a);attachImageFallback($('content'))}
function chartBounds(){let highest=Math.max(1,...records.map(r=>Math.max(0,num(r.price)||0)));let supplied=Number($('maxPrice').value);let max=$('maxPrice').value&&supplied>0?supplied:Math.ceil(highest);let sp=Number($('splitPrice').value);let split=$('splitPrice').value&&Number.isFinite(sp)?Math.max(0,Math.min(max,sp)):max/2;return {max,split}}
function renderChart(a){const {max,split}=chartBounds(),plottable=a.filter(r=>validNum(r.price)&&validNum(r.rating));let groups=new Map();plottable.forEach(r=>{let x=5+(Math.max(1,Math.min(10,Number(r.rating)))-1)/9*90,y=95-Math.max(0,Math.min(max,Number(r.price)))/max*90;let k=`${Number(r.rating)}|${Number(r.price)}`;if(!groups.has(k))groups.set(k,{x,y,items:[]});groups.get(k).items.push(r)});const groupList=[...groups.values()];window.chartGroups=groupList;
$('content').innerHTML=`<div class="chartlayout"><div class="chartwrap"><div class="axislabel">價錢 ↑ · 上限 $${fmt(max)} · 分界 $${fmt(split)}</div><div class="chart"><div class="axisx" style="top:${95-split/max*90}%"></div><div class="axisy" style="left:50%"></div><span class="quad tl">浪費金錢</span><span class="quad tr">貴婦之選</span><span class="quad bl">平價粗用</span><span class="quad br">必須回購</span>${groupList.map((g,i)=>`<button class="dot ${g.items.some(r=>String(r.id)===String(selected))?'selected':''}" style="left:${g.x}%;top:${g.y}%" data-action="point" data-group="${i}" title="${esc(g.items.map(r=>`${r.name} · $${fmt(r.price)} · ${ratingText(r)}`).join('\n'))}" aria-label="${esc(g.items.length>1?g.items.length+' 筆重疊記錄':g.items[0].name)}">${g.items.length>1?g.items.length:''}</button>`).join('')}</div><div class="axislabel" style="text-align:right">評分 1 → 10 · 分界 5.5 · 點選圓點查看對應記錄</div>${plottable.length<a.length?`<p class="help">${a.length-plottable.length} 筆缺少價錢或評分，仍可在右方清單查看。</p>`:''}</div><div class="chartlist"><div class="muted">圖中記錄 · ${a.length} 筆</div>${a.map(r=>`<div class="mini ${String(selected)===String(r.id)?'selected':''}" data-record="${esc(r.id)}">${image(r,'')}<div><button class="link name" style="text-align:left;padding:0;color:inherit" data-action="select" data-id="${esc(r.id)}">${esc(r.name||'未命名面膜')}</button><div class="comment">${num(r.price)===null?'—':'$'+fmt(r.price)} · ${ratingText(r)}</div><button class="link" data-action="detail" data-id="${esc(r.id)}">查看詳情 →</button></div></div>`).join('')}</div></div>`}

async function loadData(){if(!db||loading)return false;loading=true;$('reloadButton').disabled=true;$('connection').textContent='更新中…';if(!loaded)render();try{let all=[];const size=1000;for(let from=0;;from+=size){const {data,error}=await db.from('masks').select('*').order('created_at',{ascending:false}).order('id',{ascending:false}).range(from,from+size-1);if(error)throw error;all.push(...(data||[]));if(!data||data.length<size)break}records=all;loaded=true;$('loadError').hidden=true;$('connection').textContent='● 已連接原有資料庫';$('lastUpdated').textContent='更新於 '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'});render();return true}catch(e){$('loadError').hidden=false;$('loadError').textContent='讀取失敗：'+(e.message||String(e))+'\n請檢查網絡及 Supabase 讀取權限。';$('connection').textContent=loaded?'更新失敗 · 顯示上次資料':'未能連接';return false}finally{loading=false;$('reloadButton').disabled=false;if(!loaded)render()}}

function mount(title,body,type){releasePreview();previousFocus=$('overlay').hidden?document.activeElement:previousFocus;dirty=false;currentPanel=type;$('overlay').hidden=false;$('overlay').className='overlay';$('overlay').innerHTML=`<section class="drawer" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><div class="drawerhead"><h2 id="dialogTitle">${esc(title)}</h2><button data-action="close" aria-label="關閉">✕</button></div>${body}</section>`;attachImageFallback($('overlay'));document.body.style.overflow='hidden';$('overlay').querySelector('input:not([type=file]),.drawerhead button')?.focus()}
function closePanel(force=false){if(!force&&!canLeave())return;dirty=false;currentPanel='';releasePreview();$('overlay').hidden=true;document.body.style.overflow='';previousFocus?.focus()}
function showDetail(id){if(!canLeave())return;let r=findRecord(id);if(!r)return;mount('面膜詳情',`${image(r,'heroimg')}<h2 style="font-size:22px;margin-top:24px;line-height:1.5">${esc(r.name||'未命名面膜')}</h2><div class="muted">By ${esc(r.user_name||'未填人名')}</div><div class="stats"><div class="stat">價錢<strong>${num(r.price)===null?'—':'$'+fmt(r.price)}</strong></div><div class="stat">評分<strong>${ratingText(r)}</strong></div></div><label>購入地點</label><p>${esc(r.source||'—')}</p><label>短評</label><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(r.comment||'未有短評')}</p><div class="actions"><button class="primary" data-action="edit" data-id="${esc(r.id)}">編輯記錄</button></div><button class="link danger" style="margin-top:20px" data-action="delete" data-id="${esc(r.id)}">刪除記錄</button>`,'detail')}
function nameDialog(after=false){if(!canLeave())return;mount('設定人名',`<form id="nameForm"><label for="personName">你想用咩名記錄面膜？</label><input id="personName" required maxlength="80" value="${esc(myName)}" autocomplete="nickname"><p class="help">儲存在此瀏覽器，新增記錄時自動帶入。更改名稱不會修改舊記錄，亦不代表登入或身分驗證。</p><div class="actions"><button type="button" data-action="close">取消</button><button class="primary" type="submit">儲存</button></div></form>`,'name');$('nameForm').addEventListener('input',()=>dirty=true);$('nameForm').addEventListener('submit',e=>{e.preventDefault();let n=$('personName').value.trim();if(!n){$('personName').setCustomValidity('請輸入人名');$('personName').reportValidity();$('personName').setCustomValidity('');return}myName=n;try{localStorage.setItem('mask_username',myName)}catch(e){toast('人名已設定，但瀏覽器未能記住設定')}updateNameButton();closePanel(true);if(after)openForm();else toast('已更新人名，舊記錄保持不變')})}
function openForm(id){if(!db){toast('未能連接資料庫');return}if(!canLeave())return;if(id===undefined&&!myName){nameDialog(true);return}editing=id===undefined?null:findRecord(id);if(id!==undefined&&!editing)return;uploadFile=null;const r=editing||{};let long=(r.comment||'').length>20;mount(editing?'編輯記錄':'新增記錄',`<form id="recordForm"><label for="fuser">記錄人 *</label><input id="fuser" required maxlength="80" value="${esc(editing?(r.user_name||''):myName)}"><p class="help">${editing?'保留此筆原有人名；只在需要修正時修改。':'自動帶入目前人名；可以為此筆記錄修改。'}</p><img id="preview" class="heroimg" style="height:170px" src="${esc(safeUrl(r.img_url))}" alt="圖片預覽" data-fallback><label for="fimage">上傳／更換圖片（選填）</label><input id="fimage" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><p class="help">支援 JPG、PNG、WebP、GIF，最多 5MB。未選新圖會保留原圖。</p><label for="fname">面膜名稱 *</label><input id="fname" required value="${esc(r.name||'')}"><div class="formrow"><div><label for="fprice">價錢 *</label><input id="fprice" type="number" min="0" step="any" required value="${esc(r.price??'')}"></div><div><label for="frating">評分（1–10）*</label><input id="frating" type="number" min="1" max="10" step="any" required value="${esc(r.rating??'')}"></div></div><label for="fsource">購入地點</label><input id="fsource" value="${esc(r.source||'')}"><label for="fcomment">短評 <span id="counter">${(r.comment||'').length} / 20</span></label><textarea id="fcomment" ${long?'':'maxlength="20"'}>${esc(r.comment||'')}</textarea>${long?'<p class="help">此舊記錄超過 20 字，編輯時保留原文，不會截斷。</p>':''}<div class="formerror" id="formError" role="alert"></div><div class="actions"><button type="button" data-action="close">取消</button><button class="primary" id="saveButton" type="submit">儲存記錄</button></div></form>`,'form');$('recordForm').addEventListener('input',()=>dirty=true);$('fcomment').addEventListener('input',()=>{$('counter').textContent=$('fcomment').value.length+' / 20'});$('fimage').addEventListener('change',readImage);$('recordForm').addEventListener('submit',saveRecord)}
function readImage(){let f=$('fimage').files[0];if(!f){uploadFile=null;releasePreview();$('preview').src=safeUrl(editing?.img_url);return}if(!['image/jpeg','image/png','image/webp','image/gif'].includes(f.type)||f.size>5*1024*1024){$('fimage').value='';toast('請選擇 5MB 以下 JPG、PNG、WebP 或 GIF 圖片');return}uploadFile=f;releasePreview();previewURL=URL.createObjectURL(f);$('preview').src=previewURL;dirty=true}
function setFormBusy(value){busy=value;let form=$('recordForm');if(form){form.querySelectorAll('input,textarea,button').forEach(el=>el.disabled=value);$('saveButton').textContent=value?'儲存中…':'儲存記錄'}}
async function saveRecord(e){e.preventDefault();if(busy)return;let name=$('fname').value.trim(),user=$('fuser').value.trim(),price=Number($('fprice').value),rating=Number($('frating').value);if(!name||!user||!Number.isFinite(price)||price<0||!Number.isFinite(rating)||rating<1||rating>10){$('formError').textContent='請填寫名稱、人名、有效價錢及 1–10 評分。';return}const payload={name,price,rating,source:$('fsource').value.trim(),comment:$('fcomment').value,user_name:user};const id=editing?.id;let uploadedPath=null,committed=false;setFormBusy(true);$('formError').textContent='';try{if(uploadFile){let ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'}[uploadFile.type];uploadedPath=`${Date.now()}-${crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}.${ext}`;let {error}=await db.storage.from('mask-images').upload(uploadedPath,uploadFile,{contentType:uploadFile.type,upsert:false});if(error)throw error;let {data}=db.storage.from('mask-images').getPublicUrl(uploadedPath);payload.img_url=data.publicUrl}
let result=id!==undefined?await db.from('masks').update(payload).eq('id',id).select('*'):await db.from('masks').insert([payload]).select('*');if(result.error)throw result.error;if(result.data?.length!==1)throw new Error('未確認記錄已儲存：可能資料已刪除或權限不足。請更新後確認。');committed=true;let saved=result.data[0];if(id!==undefined)records=records.map(r=>String(r.id)===String(id)?saved:r);else records.unshift(saved);loaded=true;dirty=false;busy=false;closePanel(true);render();const visible=getResults().some(r=>String(r.id)===String(saved.id));toast(visible?'已儲存記錄 ✓':'已儲存；此記錄不符合目前搜尋條件');loadData()
}catch(err){/* Keep uploaded images on an uncertain database response to avoid breaking a committed record. */$('formError').textContent='儲存失敗：'+(err.message||String(err))+'\n內容已保留，請檢查網絡、資料權限或圖片上傳設定。'}finally{if(!committed)setFormBusy(false)}}
async function deleteRecord(id){if(busy)return;let r=findRecord(id);if(!r)return;if(!confirm(`確定刪除「${r.name}」？\n這會刪除正式資料，舊版網站亦會同步失去此筆記錄，無法在此復原。`))return;busy=true;try{const {data,error}=await db.from('masks').delete().eq('id',r.id).select('id');if(error)throw error;if(data?.length!==1)throw new Error('未確認刪除成功，可能權限不足或記錄已不存在。');records=records.filter(x=>String(x.id)!==String(id));busy=false;closePanel(true);render();toast('已刪除記錄');loadData()}catch(e){toast('刪除失敗：'+(e.message||e))}finally{busy=false}}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
function handleAction(e){let b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='detail')showDetail(id);else if(a==='edit')openForm(id);else if(a==='delete')deleteRecord(id);else if(a==='close')closePanel();else if(a==='clear')clearSearch();else if(a==='add')openForm();else if(a==='sort')sortColumn(b.dataset.field);else if(a==='point')pointGroup(Number(b.dataset.group));else if(a==='select')selectRecord(id)}
$('content').addEventListener('click',handleAction);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closePanel();else handleAction(e)});$('search').addEventListener('input',render);$('clearSearch').addEventListener('click',clearSearch);$('sort').addEventListener('change',render);$('listTab').addEventListener('click',()=>setView('list'));$('chartTab').addEventListener('click',()=>setView('chart'));$('reloadButton').addEventListener('click',loadData);$('addButton').addEventListener('click',()=>openForm());$('userButton').addEventListener('click',()=>nameDialog());$('maxPrice').addEventListener('input',()=>{if(view==='chart')render()});$('splitPrice').addEventListener('input',()=>{if(view==='chart')render()});
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();closePanel()}if(e.key==='Tab'){let f=[...$('overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),[tabindex="0"]')].filter(el=>el.offsetParent!==null);if(!f.length)return;let first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue=''}});
async function init(){updateNameButton();if(!window.supabase){$('loadError').hidden=false;$('loadError').textContent='Supabase 元件未能載入，請檢查網絡後重新整理頁面。';$('connection').textContent='未能連接';render();return}db=window.supabase.createClient(SB_URL,SB_KEY);await loadData()}
init();
</script></body></html>
